name: JobHunter

# Runs the engine on GitHub's runners, which have open network access to the
# job-board APIs. Daily search queues tailored matches for review; reports go
# out Tuesdays and Fridays.
on:
  schedule:
    - cron: "7 7 * * *"       # daily search, 07:07 UTC
    - cron: "17 13 * * 2,5"   # report, Tue & Fri 13:17 UTC
  workflow_dispatch:
    inputs:
      task:
        description: "search | report | apply"
        default: "search"

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  JOBHUNTER_SHEET_ID: ${{ secrets.JOBHUNTER_SHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  REPORT_TO: ${{ secrets.REPORT_TO }}
  REPORT_FROM: ${{ secrets.REPORT_FROM }}
  SEND_APPLICATIONS: ${{ secrets.SEND_APPLICATIONS }}
  JOBHUNTER_CONFIG: config.yaml
  JOBHUNTER_CV: cv.md

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobhunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt

      - name: Materialize CV and config from secrets (if provided)
        run: |
          if [ -n "${{ secrets.JOBHUNTER_CV_B64 }}" ]; then
            echo "${{ secrets.JOBHUNTER_CV_B64 }}" | base64 -d > cv.md
          elif [ ! -f cv.md ]; then cp cv.example.md cv.md; fi
          if [ -n "${{ secrets.JOBHUNTER_CONFIG_B64 }}" ]; then
            echo "${{ secrets.JOBHUNTER_CONFIG_B64 }}" | base64 -d > config.yaml
          elif [ ! -f config.yaml ]; then cp config.example.yaml config.yaml; fi

      - name: Search (daily)
        if: github.event.schedule == '7 7 * * *' || github.event.inputs.task == 'search'
        run: python -m jobhunter search

      - name: Apply approved (opt-in email only)
        if: github.event.inputs.task == 'apply'
        run: python -m jobhunter apply

      - name: Report (Tue & Fri)
        if: github.event.schedule == '17 13 * * 2,5' || github.event.inputs.task == 'report'
        run: python -m jobhunter report
