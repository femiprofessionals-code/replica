name: JobHunter

# Runs the engine on GitHub's runners, which have open network access to the
# job-board APIs. Daily search queues tailored matches for review; reports go
# out Tuesdays and Fridays.
on:
  schedule:
    - cron: "7 7 * * *"       # daily search, 07:07 UTC
    - cron: "17 13 * * 2,5"   # report, Tue & Fri 13:17 UTC
  workflow_dispatch:
    inputs:
      task:
        description: "search | report | apply"
        default: "search"

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
  ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
  USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
  USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
  JOBHUNTER_SHEET_ID: ${{ secrets.JOBHUNTER_SHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  REPORT_TO: ${{ secrets.REPORT_TO }}
  REPORT_FROM: ${{ secrets.REPORT_FROM }}
  SEND_APPLICATIONS: ${{ secrets.SEND_APPLICATIONS }}
  # Default to the committed profile; override with secrets if desired.
  JOBHUNTER_CONFIG: profiles/jummy/config.yaml
  JOBHUNTER_CV: profiles/jummy/cv.md

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobhunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt

      - name: Search (daily)
        if: github.event.schedule == '7 7 * * *' || github.event.inputs.task == 'search'
        run: python -m jobhunter search

      - name: Apply approved (opt-in email only)
        if: github.event.inputs.task == 'apply'
        run: python -m jobhunter apply

      - name: Report (Tue & Fri)
        if: github.event.schedule == '17 13 * * 2,5' || github.event.inputs.task == 'report'
        run: python -m jobhunter report
